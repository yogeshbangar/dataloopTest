<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
  <title>OpenCV.js Webcam Frame Processing</title>
  <style>
    :root {
      color-scheme: dark light;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #0e0f13;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      line-height: 1.5;
    }
    video, canvas {
      width: 640px;
      height: 480px;
      display: block;
      margin: 10px auto;
      background: #14161c;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    @media (prefers-color-scheme: light) {
      body {
        background: #ffffff;
        color: #111111;
      }
      video, canvas {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }
    }
  </style>
</head>
<body>

  <video id="video" autoplay playsinline controls crossorigin="anonymous" src="http://127.0.0.1:8080/video.mp4"></video>
  <canvas id="canvas"></canvas>

  <!-- OpenCV.js CDN -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Wait for OpenCV to initialize
    function waitForOpenCV(callback) {
      const check = () => {
        if (!window.cv) {
          setTimeout(check, 50);
          return;
        }
        if (cv.Mat) {
          callback();
        } else {
          cv['onRuntimeInitialized'] = callback;
        }
      };
      check();
    }

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        video.addEventListener('play', () => {
          console.log('Playing video~~~~~');
          processVideo();
        });
      } catch (err) {
        console.error('Camera error:', err);
      }
    }

    function processVideo() {
      console.log('Processing video');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (!canvas.width || !canvas.height) {
        console.warn('Canvas has zero size; skipping frame processing');
        return;
      }

      const src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
      const gray = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC1);

      const FPS = 30;

      function loop() {
        if (video.paused || video.ended) {
          src.delete();
          gray.delete();
          return;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        src.data.set(imageData.data);

        // Convert to grayscale
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.cvtColor(gray, src, cv.COLOR_GRAY2RGBA);
        imageData.data.set(src.data);
        ctx.putImageData(imageData, 0, 0);
        console.log('Processed frame');

        setTimeout(loop, 1000 / FPS);
      }

      loop();
    }

    // Start everything
    waitForOpenCV(() => {
      const startProcessing = () => {
        if (video._processingStarted) return;
        video._processingStarted = true;
        processVideo();
      };

      if (!video.paused && !video.ended && video.readyState >= 2) {
        startProcessing();
      } else {
        video.addEventListener('play', startProcessing, { once: true });
      }
    });
  </script>

</body>
</html>
