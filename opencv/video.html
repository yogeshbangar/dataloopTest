<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
  <script src="VideoFrame.js"></script>
  <title>OpenCV.js Webcam Frame Processing</title>
  <style>
    :root {
      color-scheme: dark light;
    }
    body {
      margin: 0;
      padding: 16px;
      background: #0e0f13;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      line-height: 1.5;
    }
    video, canvas {
      width: 640px;
      height: 480px;
      display: block;
      margin: 10px auto;
      background: #14161c;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    @media (prefers-color-scheme: light) {
      body {
        background: #ffffff;
        color: #111111;
      }
      video, canvas {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }
    }
  </style>
</head>
<body>

  <video id="video-player" playsinline controls crossorigin="anonymous" src="http://127.0.0.1:8080/video.mp4"></video>
  <canvas id="canvas"></canvas>
  <div id="controls" style="max-width: 640px; margin: 10px auto; display: flex; gap: 8px; align-items: center;">
    <button id="moveBackBtn" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #2a2f3a; background: #1d2130; color: #e8e8e8; cursor: pointer;">backward</button>
    <input id="frameInput" type="number" min="0" step="1" value="0" style="flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #2a2f3a; background: #0e0f13; color: #e8e8e8;" />
    <button id="moveBtn" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #2a2f3a; background: #1d2130; color: #e8e8e8; cursor: pointer;">forward</button>
    <button id="jumpBtn" style="padding: 6px 12px; border-radius: 6px; border: 1px solid #2a2f3a; background: #1d2130; color: #e8e8e8; cursor: pointer;">Go to frame</button>
  </div>

  <!-- OpenCV.js CDN -->
  <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>

  <script>
    const video = document.getElementById('video-player');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const frameInput = document.getElementById('frameInput');
    const jumpBtn = document.getElementById('jumpBtn');
    const moveBtn = document.getElementById('moveBtn');
    const moveBackBtn = document.getElementById('moveBackBtn');
    const PROCESS_FPS = 30; // assumed fps for frame->time mapping
    const player = new VideoFrame({
            id: 'video-player',
            frameRate: PROCESS_FPS
        })
        
    // Wait for OpenCV to initialize
    function waitForOpenCV(callback) {
      const check = () => {
        if (!window.cv) {
          setTimeout(check, 50);
          return;
        }
        if (cv.Mat) {
          callback();
        } else {
          cv['onRuntimeInitialized'] = callback;
        }
      };
      check();
    }

    // Start camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;

        // video.addEventListener('play', () => {
        //   console.log('Playing video~~~~~');
        //   processVideo();
        // });
      } catch (err) {
        console.error('Camera error:', err);
      }
    }

    function processVideo() {
      console.log('Processing video');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      if (!canvas.width || !canvas.height) {
        console.log('Canvas has zero size; skipping frame processing');
        return;
      }

      const src = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC4);
      const gray = new cv.Mat(canvas.height, canvas.width, cv.CV_8UC1);

      const renderFrame = () => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        src.data.set(imageData.data);
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.cvtColor(gray, src, cv.COLOR_GRAY2RGBA);
        imageData.data.set(src.data);
        ctx.putImageData(imageData, 0, 0);
      };

      const loop = () => {
        if (video.paused || video.ended) {
          src.delete();
          gray.delete();
          return;
        }
        renderFrame();
        requestAnimationFrame(loop);
      };

      loop();
    }

    // Start everything
    waitForOpenCV(() => {
      const startProcessing = () => {
        if (video._processingStarted) return;
        video._processingStarted = true;
        processVideo();
      };

      if (!video.paused && !video.ended && video.readyState >= 2) {
        startProcessing();
      } else {
        // video.addEventListener('play', startProcessing, { once: true });
      }
    });

    
    // Seek to a specific frame and render exactly one processed frame without playing
    async function jumpToFrame() {
      const frame = parseInt(frameInput.value, 10);
      if (Number.isNaN(frame) || frame < 0) return;

      // Cancel any playback and pending autoplay
      video.pause();

      const targetSeconds = frame / PROCESS_FPS;
      const duration = Number.isFinite(video.duration) ? video.duration : undefined;
      const epsilon = 0.05;
      const clampedSeconds = duration ? Math.max(0, Math.min(duration - epsilon, targetSeconds)) : Math.max(0, targetSeconds);

      const onSeeked = () => {
        if (!window.cv || !cv.Mat) return;
        // Render one processed frame without starting the loop
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (!w || !h) return;
        canvas.width = w;
        canvas.height = h;

        const src = new cv.Mat(h, w, cv.CV_8UC4);
        const gray = new cv.Mat(h, w, cv.CV_8UC1);
        ctx.drawImage(video, 0, 0, w, h);
        const imageData = ctx.getImageData(0, 0, w, h);
        src.data.set(imageData.data);
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.cvtColor(gray, src, cv.COLOR_GRAY2RGBA);
        imageData.data.set(src.data);
        ctx.putImageData(imageData, 0, 0);
        src.delete();
        gray.delete();
      };
      video.addEventListener('seeked', onSeeked, { once: true });

      // video.currentTime = clampedSeconds;
      if (frame === 0) {
            player?.seekTo({ seconds: 0 })
        } else {
            player?.seekTo({ frame, startTime: 0 })
        }
    }

    jumpBtn.addEventListener('click', jumpToFrame);
    moveBtn.addEventListener('click', moveToFrame);
    moveBackBtn.addEventListener('click', moveBackToFrame);
    function moveToFrame() {
      frameInput.value = parseInt(frameInput.value, 10) + 1;
      jumpToFrame();
    }
    function moveBackToFrame() {
      frameInput.value = parseInt(frameInput.value, 10) - 1;
      jumpToFrame();
    }
  </script>

</body>
</html>
