<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FFmpeg Load Example</title>
  </head>
  <body>
    <h2>FFmpeg Load Test</h2>
    <button id="loadBtn">Load FFmpeg</button>
    <pre id="log"></pre>

    <script type="module">
      async function loadFFmpegFromBlob() {
        const umdUrl = "./ffmpeg.min.js";
        const res = await fetch(umdUrl);
        const txt = await res.text();
        const blob = new Blob([txt], { type: "application/javascript" });
        const blobUrl = URL.createObjectURL(blob);

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = blobUrl;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
        URL.revokeObjectURL(blobUrl);
        return new FFmpegWASM.FFmpeg();
      }
      async function toBlobURL(url, mimeType) {
        const res = await fetch(url);
        const blob = await res.blob();
        return URL.createObjectURL(new Blob([blob], { type: mimeType }));
      }
      function log(msg) {
        logEl.textContent += msg + "\n";
      }
      document.getElementById("loadBtn").onclick = async () => {
        log("⏳ Loading FFmpeg…");
        const ffmpeg = await loadFFmpegFromBlob();
        console.log(ffmpeg, "ffmpeg~~~~~~ loaded");
        const baseURL = "./esm";
        const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`,"text/javascript");
        const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`,"application/wasm");
        const workerURL = await toBlobURL(`${baseURL}/ffmpeg-core.worker.js`,"text/javascript");
        console.log("baseURL~~~~~A~ loaded", coreURL);

        await ffmpeg.load({
          classWorkerURL: workerURL,
          coreURL,
          wasmURL,
        });
        console.log("baseURL~~~~B~~ loaded", coreURL);
        const video = await fetch("./video.mp4");
        console.log("ffmpeg~~~~~~ loaded", video);
        await ffmpeg.writeFile("test.avi", video);
        await ffmpeg.ffprobe([
          "-v",
          "error",
          "-show_entries",
          "format=duration:stream=nb_frames",
          "-of",
          "default=noprint_wrappers=1:nokey=1",
          "test.avi",
          "-o",
          "output.txt",
        ]);

        log("✅ FFmpeg Loaded!");
      };
    </script>
  </body>
</html>
