<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Video Frame Extraction</title>
    <script
      async
      src="https://docs.opencv.org/4.x/opencv.js"
      type="text/javascript"
    ></script>
  </head>
  <body>
    <h1>Extract Frame with OpenCV.js</h1>
    <video id="video" style="display:none;"></video>
    <canvas id="canvas"></canvas>

    <script>
      function extractFrameFromVideo(videoUrl, frameNo) {
        let video = document.getElementById("video");
        video.src = videoUrl;

        video.addEventListener("loadedmetadata", () => {
          let fps = 30; // You can hardcode or calculate if you know total frames
          let time = frameNo / fps; // convert frame number to seconds
          video.currentTime = time; // seek to the desired time
        });

        video.addEventListener("seeked", () => {
          // Draw video frame on canvas
          let canvas = document.getElementById("canvas");
          let ctx = canvas.getContext("2d");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          // Now use OpenCV.js to read the canvas
          let src = cv.imread(canvas);
          console.log("Extracted Frame as cv.Mat:", src);

          // Example: show the frame on canvas (already done) or process it
        });
      }

      window.addEventListener("load", () => {
        cv["onRuntimeInitialized"] = () => {
          extractFrameFromVideo("./video.mp4", 100);
        };
      });
    </script>
  </body>
</html>
