<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLayers Max Zoom Label</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
            aspect-ratio: 2 / 1;
        }

        #zoomLabel {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px;
            font-size: 14px;
            z-index: 100;
        }
    </style>
    <!-- OpenLayers CDN Links -->
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
</head>

<body>
    <div id="map"></div>
    <div id="zoomLabel">Max Zoom: </div>

    <script>
        // Initialize the map view with specific zoom and maxZoom
        const view0 = new ol.View({
            center: [-120.96050943116101, 37.73070890660541],
            zoom: 21,
            projection: 'EPSG:4326',
            showFullExtent: true
        });

        const view = new ol.View({
            center: ol.proj.fromLonLat([-120.96050943116101, 37.73070890660541]), // Convert to EPSG:3857
            zoom: 21,
            projection: 'EPSG:3857', // Use Web Mercator projection
        });


        const url = 'https://tile.cape-gcp-production.com/surveys/1728038/tiles/{z}/{x}/{y}?auth_token=fM68PVOJO8p5m2sPo4Cqdcoi4sLSsecR&datatype_name=vexcel_urban_vertical_jpg&enhance=true'
        // Initialize the map
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.XYZ({ url }),
                }),
            ],
            view: view,
        });

    </script>
</body>

</html>
