<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Camera Calibration with Distortion</title>
  <style>body { margin: 0; overflow: hidden; }</style>
  <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/controls/OrbitControls.js"></script>
  <script src='shader.js'></script>
  <script src='fish.js'></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #333;
    }
    #fishImg {
      position: absolute;
      top: 0;
      left: 0;
      width: 2848px;
      height: 2848px;
      z-index: -1;
    }
   
    #fishText {
      position: absolute;
      top: 0;
      left: 0;
      color: white;
      font-size: 48px;
      text-align: center;
      z-index: 100;
       -webkit-text-stroke: 2px black;
    }
  </style>
</head>
<body>
  <img id="fishImg" src="img0.jpg" alt="Fish Image" />
  <div id="fishText">Hello</div>
  <script>
     window.onload = (event) => {
        console.log("~~~~~~~~~~~~ page is fully loaded ~~~~~~~~~~~~~~");
        fetch('frames.json')
          .then(response => response.json())
          .then(data => {
            new FishEye(data);
          })
          .catch(error => console.error('Error loading fish data:', error));
      };
  </script>
</body>
</html>
