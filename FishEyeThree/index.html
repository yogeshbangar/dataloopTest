<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Camera Calibration with Distortion</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <script src="three/three.min.js"></script>
    <script src="three/CopyShader.js"></script>
    <script src="three/EffectComposer.js"></script>
    <script src="three/RenderPass.js"></script>
    <script src="three/ShaderPass.js"></script>
    <script src="three/OrbitControls.js"></script>
    <script src="shader.js"></script>
    <script src="shader4.js"></script>
    <script src="fish.js"></script>
    <style>
      #fishImg {
        position: absolute;
        top: 0;
        left: 0;
        width: 2848px;
        height: 2848px;
        z-index: -1;
      }

      #fishText {
        position: absolute;
        top: 0px;
        left: 0px;
        color: white;
        font-size: 28px;
        text-align: center;
        z-index: 100;
        background-color: #3338;
        padding: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
      }
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0c0c0c, #1a1a2e);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        color: white;
      }

      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #info-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 20px;
        z-index: 100;
        max-width: 50vw;
        font-size: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      .check-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #distortion-controls > div {
        width: 50vw;
      }
    </style>
  </head>
  <body>
    <img id="fishImg" src="img0.jpg" alt="Fish Image" />
    <div id="fishText">Hello</div>
    <script>
      window.onload = (event) => {
        fetch("frames_fisheye.json")
          .then((response) => response.json())
          .then((data) => {
            new FishEye(data);
          })
          .catch((error) => console.error("Error loading fish data:", error));
      };
    </script>
    <div id="info-panel" class="panel-container">
      <div id="distortion-controls" style="display: unset">
        <div style="margin: 10px 0">
          <div class="check-toggle">
            <label style="display: block; margin-bottom: 5px">
              k1: <span id="k1-value">0.007</span>
            </label>
            <div>
              <label for="distortion-toggle">Toggle Distortion</label>
              <input
                type="checkbox"
                id="distortion-toggle"
                style="margin-left: 10px"
              />
            </div>
          </div>

          <input
            type="range"
            id="k1-slider"
            min="-10"
            max="10"
            step="0.001"
            value="0.007"
            style="width: 100%; margin-bottom: 5px"
          />
        </div>
        <div style="margin: 10px 0">
          <label style="display: block; margin-bottom: 5px"
            >k2: <span id="k2-value">-0.021</span></label
          >
          <input
            type="range"
            id="k2-slider"
            min="-10"
            max="10"
            step="0.001"
            value="-0.021"
            style="width: 100%; margin-bottom: 5px"
          />
        </div>
        <div style="margin: 10px 0">
          <label style="display: block; margin-bottom: 5px"
            >k3: <span id="k3-value">0.011</span></label
          >
          <input
            type="range"
            id="k3-slider"
            min="-10"
            max="10"
            step="0.001"
            value="0.011"
            style="width: 100%; margin-bottom: 5px"
          />
        </div>
      </div>
      <div id="skew-controls" style="display: unset">
        <div style="margin: 10px 0">
          <label style="display: block; margin-bottom: 5px"
            >p1: <span id="p1-value">0.0</span></label
          >
          <input
            type="range"
            id="p1-slider"
            min="-1"
            max="1"
            step="0.01"
            value="0"
            style="width: 100%; margin-bottom: 5px"
          />
          <label style="display: block; margin-bottom: 5px"
            >p2: <span id="p2-value">0.0</span></label
          >
          <input
            type="range"
            id="p2-slider"
            min="-1"
            max="1"
            step="0.01"
            value="0"
            style="width: 100%; margin-bottom: 5px"
          />
        </div>
      </div>
    </div>
  </body>
</html>
