<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js Camera Calibration with Distortion</title>
  <style>body { margin: 0; overflow: hidden; }</style>
  <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
</head>
<body>
  <script>
    // Intrinsic + Distortion Parameters
    const fx = 1348.24912982949;
    const fy = 1346.68647874027;
    const cx = 1453.46954132925;
    const cy = 1346.68647874027;
    const skew = 0;
    const k1 = 0.00698656468783847;
    const k2 = -0.0213389719037511;
    const k3 = 0.0110192218872101;
    const p1 = 0.0;
    const p2 = 0.0;
    const width = window.innerWidth;
    const height = window.innerHeight;

    // Compute FOV from fy
    const fovY = (2 * Math.atan(height / (2 * fy))) * (180 / Math.PI);
    const aspect = width / height;

    // Scene Setup
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    document.body.appendChild(renderer.domElement);

    // Camera Setup
    const camera = new THREE.PerspectiveCamera(fovY, aspect, 0.1, 1000);
    camera.position.set(2.91009310732219, -0.329979128789767, 1.27328902194473);
    camera.quaternion.set(-0.486636668118953, 0.505317555083973, -0.516367282014753, 0.491124985956464);

    // Adjust Projection Matrix for cx, cy, skew
    function adjustProjectionMatrix(cam, cx, cy, skew) {
      const offsetX = (cx - width / 2) / (width / 2);
      const offsetY = -(cy - height / 2) / (height / 2);
      const skewFactor = skew / fx;

      const proj = cam.projectionMatrix.clone();
      proj.elements[8] = offsetX + skewFactor;
      proj.elements[9] = offsetY;

      cam.projectionMatrix.copy(proj);
    }

    adjustProjectionMatrix(camera, cx, cy, skew);

    // Simple Cube
    const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshNormalMaterial());
    scene.add(cube);
    const scale = 1.5; // Scale factor for the cube
    cube.scale.set(scale,scale,scale);
    cube.position.set(-8, -6, 6);

    // Shader: Radial + Tangential Distortion
    const DistortionShader = {
      uniforms: {
        tDiffuse: { value: null },
        k1: { value: k1 },
        k2: { value: k2 },
        k3: { value: k3 },
        p1: { value: p1 },
        p2: { value: p2 },
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float k1, k2, k3, p1, p2;
        varying vec2 vUv;

        void main() {
          vec2 uv = vUv * 2.0 - 1.0;
          float x = uv.x;
          float y = uv.y;
          float r2 = x*x + y*y;
          float r4 = r2 * r2;
          float r6 = r4 * r2;

          float radial = 1.0 + k1 * r2 + k2 * r4 + k3 * r6;

          // Tangential distortion
          float dx = 2.0 * p1 * x * y + p2 * (r2 + 2.0 * x * x);
          float dy = p1 * (r2 + 2.0 * y * y) + 2.0 * p2 * x * y;

          vec2 distorted = vec2(x * radial + dx, y * radial + dy);
          distorted = (distorted + 1.0) / 2.0;

          if (distorted.x < 0.0 || distorted.x > 1.0 || distorted.y < 0.0 || distorted.y > 1.0) {
            gl_FragColor = vec4(0.0);
          } else {
            gl_FragColor = texture2D(tDiffuse, distorted);
          }
        }
      `
    };

    // Composer
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const distortionPass = new THREE.ShaderPass(DistortionShader);
    composer.addPass(distortionPass);
    const inc = 1;
    document.addEventListener("keyup", ()=> {
      switch (event.key) {
        case "ArrowUp":
          cube.position.z += inc;
          break;
        case "ArrowDown":
          cube.position.z -= inc;
          break;
        case "ArrowLeft":
          cube.position.x -= inc;
          break;
         case "ArrowRight":
          cube.position.x += inc;
          break;
        case "a":
          cube.position.y += inc;
          break;
        case "z":
          cube.position.y -= inc;
          break;

        case "w":
          cube.position.set(-8, -6, 6);
          break;
        
      }
      console.log(cube.position,"Key keyup~~!~",event.key);
    });
    // Animate
    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.y += 0.01;
      cube.rotation.z += 0.01;
      composer.render();
    }

    animate();
  </script>
</body>
</html>
