<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fisheye Lens Distortion Correction</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Include Three.js and necessary postprocessing scripts -->
  <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="three/CopyShader.js"></script>
  <script>
    // === Sample Calibration Data ===
    const calibrationData = {
      "position": { "x": -3.8195, "y": -0.0707, "z": 0.7307 },
      "rotation": { "x": 0.3949, "y": -0.5928, "z": -0.5854, "w": 0.3871 },
      "intrinsicData": {
        "vfov": 97.9998472,
        "cxOffset": 0.59267,
        "cyOffset": -7.22379,
        "lensCoeffs": {
          "k1": .46635917211,
          "k2": .03248178784,
          "k3": -.0521509689,
          "p1": 0.0001,
          "p2": 0.0001
        },
        "aspectRatio": 1.0
      },
      "imageWidth": 1024,
      "imageHeight": 1024,
      "imageSrc": "img0.jpg" // Replace with your image path
    };

    let scene, camera, renderer, composer;

    init();
    animate();

    function init() {
      // === Initialize Scene and Renderer ===
      scene = new THREE.Scene();
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(calibrationData.imageWidth, calibrationData.imageHeight);
      document.body.appendChild(renderer.domElement);

      // === Set Background Image ===
      const loader = new THREE.TextureLoader();
      loader.load(calibrationData.imageSrc, function(texture) {
        scene.background = texture;
      });

      // === Configure Camera ===
      const { vfov, cxOffset, cyOffset, lensCoeffs, aspectRatio } = calibrationData.intrinsicData;
      const { imageWidth: width, imageHeight: height } = calibrationData;

      // Calculate vertical field of view in degrees
      const fov = vfov;
      const aspect = aspectRatio;

      camera = new THREE.PerspectiveCamera(fov, aspect, 0.1, 1000);

      // Set camera position and orientation
      const { x, y, z } = calibrationData.position;
      const { x: rx, y: ry, z: rz, w: rw } = calibrationData.rotation;
      camera.position.set(x, y, z);
      camera.quaternion.set(rx, ry, rz, rw);
      camera.updateProjectionMatrix();

      // === Add 3D Object ===
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshNormalMaterial();
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(0, 0, 0);
      scene.add(cube);

      // === Postprocessing for Lens Distortion Correction ===
      composer = new THREE.EffectComposer(renderer);
      const renderPass = new THREE.RenderPass(scene, camera);
      composer.addPass(renderPass);

      const distortionShader = {
        uniforms: {
          tDiffuse: { value: null },
          k1: { value: lensCoeffs.k1 },
          k2: { value: lensCoeffs.k2 },
          k3: { value: lensCoeffs.k3 },
          p1: { value: lensCoeffs.p1 },
          p2: { value: lensCoeffs.p2 },
          fx: { value: width / (2 * Math.tan(THREE.MathUtils.degToRad(fov / 2))) },
          fy: { value: height / (2 * Math.tan(THREE.MathUtils.degToRad(fov / 2))) },
          cx: { value: width / 2 + cxOffset },
          cy: { value: height / 2 + cyOffset },
          width: { value: width },
          height: { value: height }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D tDiffuse;
          uniform float k1, k2, k3, p1, p2;
          uniform float fx, fy, cx, cy;
          uniform float width, height;
          varying vec2 vUv;

          void main() {
            // Convert normalized coordinates to pixel coordinates
            float x = vUv.x * width;
            float y = vUv.y * height;

            // Normalize coordinates with respect to the principal point and focal length
            float xNorm = (x - cx) / fx;
            float yNorm = (y - cy) / fy;

            float r2 = xNorm * xNorm + yNorm * yNorm;
            float r4 = r2 * r2;
            float r6 = r4 * r2;

            float radial = 1.0 + k1 * r2 + k2 * r4 + k3 * r6;

            float xDistorted = xNorm * radial + 2.0 * p1 * xNorm * yNorm + p2 * (r2 + 2.0 * xNorm * xNorm);
            float yDistorted = yNorm * radial + p1 * (r2 + 2.0 * yNorm * yNorm) + 2.0 * p2 * xNorm * yNorm;

            // Convert back to pixel coordinates
            float u = fx * xDistorted + cx;
            float v = fy * yDistorted + cy;

            // Normalize back to [0,1]
            vec2 distortedUv = vec2(u / width, v / height);

            if (distortedUv.x < 0.0 || distortedUv.x > 1.0 || distortedUv.y < 0.0 || distortedUv.y > 1.0) {
              gl_FragColor = vec4(0.0);
            } else {
              gl_FragColor = texture2D(tDiffuse, distortedUv);
            }
          }
        `
      };

      const distortionPass = new THREE.ShaderPass(distortionShader);
      composer.addPass(distortionPass);
    }

    function animate() {
      requestAnimationFrame(animate);
      composer.render();
    }
  </script>
</body>
</html>
