<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Fisheye Shader</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Load Three.js and supporting libs from CDN -->
    <script src="https://unpkg.com/three@0.146.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/shaders/BarrelDistortionShader.js"></script>
    <script src="https://unpkg.com/three@0.146.0/examples/js/controls/OrbitControls.js"></script>

    <script>
      let camera, scene, renderer, composer, cube;

      window.onload = (event) => {
        console.log("page is fully loaded");
        init();
        animate();
      };
      function init() {
        // Scene and Camera
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.z = 5;

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Add a cube
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshNormalMaterial();
        cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);

        // Post-processing
        composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));

        // Fisheye Shader Pass
        const fisheyeShader = {
          uniforms: {
            tDiffuse: { value: null },
            strength: { value: 0.5 }, // Adjust for more or less distortion
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
            `,
          fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float strength;
                varying vec2 vUv;

                void main() {
                    vec2 uv = vUv * 2.0 - 1.0;
                    float r = length(uv);
                    float theta = atan(uv.y, uv.x);
                    r = pow(r, 1.0 - strength);
                    uv = r * vec2(cos(theta), sin(theta));
                    uv = uv * 0.5 + 0.5;
                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                    gl_FragColor = vec4(0.0);
                    } else {
                    gl_FragColor = texture2D(tDiffuse, uv);
                    }
                }`,
        };

        const RadialDistortionShader = {
          uniforms: {
            tDiffuse: { value: null },
            k1: { value: 466.35917211 },
            k2: { value: 32.48178784 },
            k3: { value: -52.1509689 },
            k4: { value: 73.79780387 },
            k5: { value: -30.12830986 },
            k6: { value: -0.37231277 },
          },
          vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
          fragmentShader: `
              uniform sampler2D tDiffuse;
              uniform float k1, k2, k3, k4, k5, k6;
              varying vec2 vUv;

              void main() {
                vec2 uv = vUv * 2.0 - 1.0; // Map to [-1,1]
                float r = length(uv);

                // Radial distortion formula
                float r2 = r * r;
                float r4 = r2 * r2;
                float r6 = r4 * r2;
                float r8 = r4 * r4;
                float r10 = r8 * r2;
                float r12 = r6 * r6;

                float scale = 1.0 + k1 * r2 + k2 * r4 + k3 * r6 + k4 * r8 + k5 * r10 + k6 * r12;

                vec2 distortedUv = uv * scale;
                distortedUv = (distortedUv + 1.0) / 2.0; // Back to [0,1]

                if (distortedUv.x < 0.0 || distortedUv.x > 1.0 || distortedUv.y < 0.0 || distortedUv.y > 1.0) {
                  gl_FragColor = vec4(0.0); // Black outside
                } else {
                  gl_FragColor = texture2D(tDiffuse, distortedUv);
                }
              }
            `,
        };
        // const shaderPass = new THREE.ShaderPass(fisheyeShader);
        // composer.addPass(shaderPass);
        const radialPass = new THREE.ShaderPass(RadialDistortionShader);
        composer.addPass(radialPass);

        // Handle window resize
        window.addEventListener("resize", onWindowResize, false);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);
        composer.render();
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        cube.rotation.z += 0.01;
      }
    </script>
  </body>
</html>
