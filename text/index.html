<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Canvas Text Editor</title>
  <style>
    canvas {
      border: 1px solid #000;
      display: block;
      margin: 20px auto;
      cursor: text;
    }
  </style>
</head>
<body>
  <canvas id="textEditor" width="800" height="200"></canvas>

  <script>
    const canvas = document.getElementById('textEditor');
    const ctx = canvas.getContext('2d');

    // Editor State
    const state = {
      text: 'Welcome to the Canvas Text Editor!',
      fontSize: 20,
      fontFamily: 'Arial',
      cursorPos: 0,
      selectionStart: null,
      selectionEnd: null,
      isSelecting: false,
    };

    // Initialize Canvas
    ctx.font = `${state.fontSize}px ${state.fontFamily}`;
    ctx.textBaseline = 'top';

    function render() {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render selection
      if (state.selectionStart !== null && state.selectionEnd !== null) {
        const start = Math.min(state.selectionStart, state.selectionEnd);
        const end = Math.max(state.selectionStart, state.selectionEnd);
        const selectionText = state.text.slice(start, end);

        const metrics = ctx.measureText(state.text.slice(0, start));
        const x = metrics.width;
        const width = ctx.measureText(selectionText).width;

        ctx.fillStyle = 'rgba(173, 216, 230, 0.5)'; // Light blue
        ctx.fillRect(x, 0, width, state.fontSize);
      }

      // Render text
      ctx.fillStyle = '#000';
      ctx.fillText(state.text, 0, 0);

      // Render cursor
      const cursorX = ctx.measureText(state.text.slice(0, state.cursorPos)).width;
      ctx.fillRect(cursorX, 0, 1, state.fontSize);
    }

    function moveCursor(offset) {
      state.cursorPos = Math.max(0, Math.min(state.text.length, state.cursorPos + offset));
      state.selectionStart = null; // Clear selection when moving cursor
      state.selectionEnd = null;
      render();
    }

    function insertText(char) {
      if (state.selectionStart !== null && state.selectionEnd !== null) {
        const start = Math.min(state.selectionStart, state.selectionEnd);
        const end = Math.max(state.selectionStart, state.selectionEnd);
        state.text = state.text.slice(0, start) + char + state.text.slice(end);
        state.cursorPos = start + char.length;
        state.selectionStart = null;
        state.selectionEnd = null;
      } else {
        state.text = state.text.slice(0, state.cursorPos) + char + state.text.slice(state.cursorPos);
        state.cursorPos += char.length;
      }
      render();
    }

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;

      let cursorIndex = 0;
      for (let i = 1; i <= state.text.length; i++) {
        const width = ctx.measureText(state.text.slice(0, i)).width;
        if (width > x) break;
        cursorIndex = i;
      }

      state.cursorPos = cursorIndex;
      state.selectionStart = cursorIndex;
      state.isSelecting = true;

      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!state.isSelecting) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;

      let cursorIndex = 0;
      for (let i = 1; i <= state.text.length; i++) {
        const width = ctx.measureText(state.text.slice(0, i)).width;
        if (width > x) break;
        cursorIndex = i;
      }

      state.selectionEnd = cursorIndex;
      render();
    });

    canvas.addEventListener('mouseup', () => {
      state.isSelecting = false;
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        moveCursor(-1);
      } else if (e.key === 'ArrowRight') {
        moveCursor(1);
      } else if (e.key === 'Backspace') {
        if (state.selectionStart !== null && state.selectionEnd !== null) {
          const start = Math.min(state.selectionStart, state.selectionEnd);
          const end = Math.max(state.selectionStart, state.selectionEnd);
          state.text = state.text.slice(0, start) + state.text.slice(end);
          state.cursorPos = start;
          state.selectionStart = null;
          state.selectionEnd = null;
        } else if (state.cursorPos > 0) {
          state.text = state.text.slice(0, state.cursorPos - 1) + state.text.slice(state.cursorPos);
          state.cursorPos -= 1;
        }
        render();
      } else if (e.key.length === 1) {
        insertText(e.key);
      }
    });

    render(); // Initial render
  </script>
</body>
</html>
